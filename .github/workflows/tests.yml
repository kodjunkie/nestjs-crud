name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (pack-and-install resolution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: check manifest contracts
        run: node scripts/check-manifest-contracts.js

      - name: Enable Corepack (pre-setup-node)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (post-setup-node)
        run: corepack enable

      - name: Pin Yarn version
        # Pins Yarn to the version that matches yarn.lock (cacheKey 10c0 / lockfile version 8).
        # "yarn set version stable" previously upgraded to 4.14.x which introduced a lockfile
        # format bump (version 9) that failed --immutable.
        run: yarn set version 4.12.0

      - name: install
        run: yarn install --immutable

      - name: build
        run: yarn build

      - name: run smoke
        run: yarn smoke:pack

      - name: run core/request/util unit suite
        # Bare root jest (core + request + util specs, no DB needed). No other
        # job runs this suite: parity filters to packages/core/test/parity and
        # the test matrix runs per-adapter configs only. This is what executes
        # swagger-constants-fallback.spec.ts — the guard that fails when the
        # inlined DECORATORS fallback drifts from the installed @nestjs/swagger.
        # NODE_OPTIONS is required: NestJS 12 is ESM-only, and a bare `npx jest`
        # aborts with a require-of-ESM error before a single test runs.
        run: NODE_OPTIONS=--experimental-vm-modules npx jest --silent

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack (pre-setup-node)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (post-setup-node)
        run: corepack enable

      - name: Pin Yarn version
        # Pins Yarn to the version that matches yarn.lock (cacheKey 10c0 / lockfile version 8).
        # "yarn set version stable" previously upgraded to 4.14.x which introduced a lockfile
        # format bump (version 9) that failed --immutable.
        run: yarn set version 4.12.0

      - name: install
        run: yarn install --immutable

      - name: build
        run: yarn build

      - name: parity piece-level
        run: yarn test:parity

  test:
    runs-on: ubuntu-latest
    needs: parity
    strategy:
      fail-fast: false
      matrix:
        adapter: [typeorm, drizzle, mikro-orm, prisma]
        db: [postgres, mysql]
    env:
      COMPOSE_FILE: ./compose.yml

    steps:
      - uses: actions/checkout@v5

      - name: build docker db
        run: docker compose up -d

      - name: Enable Corepack (pre-setup-node)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (post-setup-node)
        run: corepack enable

      - name: Pin Yarn version
        # Pins Yarn to the version that matches yarn.lock (cacheKey 10c0 / lockfile version 8).
        # "yarn set version stable" previously upgraded to 4.14.x which introduced a lockfile
        # format bump (version 9) that failed --immutable.
        run: yarn set version 4.12.0

      - name: install
        run: yarn install --immutable

      - name: build
        run: yarn build

      - name: wait for DB
        run: |
          for i in {1..30}; do
            docker compose exec -T ${{ matrix.db }} sh -c 'exit 0' && break || sleep 2
          done

      - name: run ${{ matrix.adapter }} x ${{ matrix.db }} tests
        run: yarn test:${{ matrix.adapter }}:${{ matrix.db }}

  test-no-swagger:
    name: test (no-swagger)
    runs-on: ubuntu-latest
    needs: parity
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack (pre-setup-node)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (post-setup-node)
        run: corepack enable

      - name: Pin Yarn version
        # Pins Yarn to the version that matches yarn.lock — keeps --immutable working.
        # CI-03 sentinel mechanism is moduleNameMapper-based (no yarn remove) so
        # the lockfile is never touched.
        run: yarn set version 4.12.0

      - name: install
        run: yarn install --immutable

      - name: build
        run: yarn build

      - name: run no-swagger sentinel
        # NODE_OPTIONS is required: NestJS 12 is ESM-only, and a bare `npx jest`
        # aborts with a require-of-ESM error before a single test runs.
        run: NODE_OPTIONS=--experimental-vm-modules npx jest --config jest.config.no-swagger.js --coverage

      - name: upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-no-swagger
          path: coverage-no-swagger/

  knip:
    name: knip (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Does NOT depend on parity — knip is static analysis, not runtime.
    # Runs in parallel with parity/test/test-no-swagger.
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack (pre-setup-node)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (post-setup-node)
        run: corepack enable

      - name: Pin Yarn version
        # CI-wide pin; keeps --immutable working against committed yarn.lock (v8 format).
        run: yarn set version 4.12.0

      - name: install
        run: yarn install --immutable

      - name: build
        # knip needs built .d.ts for type-level reachability in some edge cases;
        # also catches config drift where knip entries reference non-existent files.
        run: yarn build

      - name: run knip
        id: knip
        # Warn-only posture at launch: findings produce output + artifact but do NOT fail the job.
        # Tighten to `continue-on-error: false` in a follow-up phase after config stabilizes.
        continue-on-error: true
        run: |
          yarn knip --reporter markdown > knip-report.md 2>&1 || true
          # Also capture JSON for tooling (dashboards, PR comments) in a follow-up:
          npx knip --reporter json --no-exit-code > knip-report.json 2>&1 || true
          echo "--- knip findings ---"
          cat knip-report.md

      - name: upload knip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: |
            knip-report.md
            knip-report.json

  node-floor:
    name: node-floor (22.12.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack (pre-setup-node)
        run: corepack enable

      - name: Setup Node.js
        # This job pins the exact published floor, not a range. A slightly
        # newer patch such as 22.14.0 already satisfies some of our
        # dependencies' own higher engine floors, which would hide the
        # advisory engine warning this job exists to characterize.
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Enable Corepack (post-setup-node)
        run: corepack enable

      - name: Pin Yarn version
        run: yarn set version 4.12.0

      - name: install
        # Engine-compatibility warnings from dependencies that declare a
        # higher floor than ours in their own engines field are expected on
        # this exact version and must not be treated as failures here.
        run: yarn install --immutable

      - name: clean and build
        run: yarn clean && yarn build

      - name: run request/util unit suite
        # Scoped to packages/request and packages/util, not the full
        # core/request/util suite the other jobs run. packages/core specs
        # import @nestjs/common (ESM-only) transitively, and Jest's own
        # require(esm) support is gated behind a runtime feature-detection
        # (vm.SourceTextModule.prototype.hasAsyncGraph) present only from
        # Node v24.9 onward. That gate lives inside Jest itself, separate
        # from Node's own require(esm) support, which is unflagged already
        # at this job's 22.12.0 floor. The line below that actually proves
        # our published CJS packages load NestJS 12 through Node's native
        # require(esm) at this floor is "run smoke", not this step.
        run: NODE_OPTIONS=--experimental-vm-modules npx jest --silent packages/util packages/request

      - name: run smoke
        run: yarn smoke:pack

  install-checks:
    name: install-checks (${{ matrix.pm }})
    runs-on: ubuntu-latest
    needs: parity
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, yarn, pnpm]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack (pre-setup-node)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (post-setup-node)
        run: corepack enable

      - name: Pin Yarn version
        run: yarn set version 4.12.0

      - name: install
        run: yarn install --immutable

      - name: build
        run: yarn build

      - name: run ${{ matrix.pm }} install check (strict peers)
        # Invokes the script directly with its flags, not through a yarn
        # script, so no package-manager environment leaks into the child.
        run: node scripts/smoke-pack.js --pm=${{ matrix.pm }} --strict-peers

  ioredis-canary:
    name: ioredis-canary
    runs-on: ubuntu-latest
    needs: parity
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack (pre-setup-node)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (post-setup-node)
        run: corepack enable

      - name: Pin Yarn version
        run: yarn set version 4.12.0

      - name: install
        run: yarn install --immutable

      - name: build
        run: yarn build

      - name: run ioredis canary
        # Passes while the known npm dependency conflict between typeorm and
        # NestJS's optional ioredis peer still reproduces; fails once it
        # stops reproducing, so a maintainer knows to remove the workaround.
        run: node scripts/smoke-pack.js --expect-ioredis-eresolve
