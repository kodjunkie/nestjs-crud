<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 80" role="img" aria-labelledby="logo-title">
  <title id="logo-title">nestjs-crud</title>
  <!-- CRUD 2x2 grid: solid red = Create, outline red = Read, solid slate = Update, outline slate = Delete -->
  <g transform="translate(14 14)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#E0234E"/>
    <rect x="30" y="0" width="22" height="22" rx="5" fill="none" stroke="#E0234E" stroke-width="3"/>
    <rect x="0" y="30" width="22" height="22" rx="5" fill="#1E293B"/>
    <rect x="30" y="30" width="22" height="22" rx="5" fill="none" stroke="#1E293B" stroke-width="3"/>
  </g>
  <text x="88" y="52" fill="#1E293B" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="32" font-weight="600" letter-spacing="-0.5">nestjs-crud</text>
</svg>
